


name: Update GitHub Profile

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # GitHub Statistics
      # ─────────────────────────────────────────────

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # GitHub Streak
      # ─────────────────────────────────────────────

      - name: Generate Streak Card
        run: |
          curl -L \
          "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&ring=00C9FF&fire=7C3AED&currStreakLabel=00C9FF" \
          -o profile/streak.svg

      # ─────────────────────────────────────────────
      # GitHub Activity Graph
      # ─────────────────────────────────────────────

      - name: Generate Activity Graph
        run: |
          curl -L \
          "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=0D1117&color=00C9FF&line=7C3AED&point=FFFFFF&area=true&hide_border=true" \
          -o profile/activity.svg

      # ─────────────────────────────────────────────
      # GitHub Profile Trophy
      # ─────────────────────────────────────────────

      - name: Generate Trophy
        run: |
          curl -L \
          "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&row=1&column=7" \
          -o profile/trophy.svg

      # ─────────────────────────────────────────────
      # Contribution Snake
      # ─────────────────────────────────────────────

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      # ─────────────────────────────────────────────
      # Commit generated files
      # ─────────────────────────────────────────────

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          git commit -m "Update GitHub profile assets" || exit 0

          git push
